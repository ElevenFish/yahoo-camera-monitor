name: Yahoo Camera Hourly Monitor

on:
  schedule:
    # UTC 00:00 至 19:00 每个整点 = 北京时间 08:00 至次日凌晨 03:00 每个整点
    - cron: '0 0-19 * * *'
  workflow_dispatch: # 保留手动一键测试按钮

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装依赖包
        run: pip install requests beautifulsoup4 pytz

      - name: 4. 运行雅虎拍卖监测并推送到双人微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
        run: python yahoo_camera_monitor.py
