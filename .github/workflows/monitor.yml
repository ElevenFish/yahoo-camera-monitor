name: Yahoo Camera Hourly Monitor

on:
  schedule:
    # UTC 01:00 至 15:00 的每个整点 = 北京时间 09:00 至 23:00 的每个整点
    - cron: '0 1-15 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装依赖包 (含 curl_cffi 浏览器指纹模拟)
        run: pip install curl_cffi requests beautifulsoup4 pytz

      - name: 4. 运行雅虎拍卖监测并推送到双人微信
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOKEN_2: ${{ secrets.PUSHPLUS_TOKEN_2 }}
        run: python yahoo_camera_monitor.py
